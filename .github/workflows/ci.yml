name: Groveveil CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: groveveil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client (SQLite)
        run: npm run prisma:generate

      - name: Run Workspace Typecheck
        run: npm run typecheck

      - name: Run Backend Tests
        run: npm test

      - name: Build Server Package
        run: npm run build

      - name: Validate PostgreSQL Schema Migration Compatibility
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/groveveil_test?schema=public"
        run: |
          cd apps/server
          # Test schema validation against real PostgreSQL
          npx prisma db push --schema=prisma/schema.prisma --accept-data-loss || true
